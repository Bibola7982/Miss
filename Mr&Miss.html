    * {

    html,
    body {
      margin: 0;

    body {
      min-height: 100vh;

      overflow-x: hidden;
      overflow-y: auto;
    }

    .container {
      width: 100%;
      max-width: 850px;
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;
      padding: 25px 20px 40px;

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: visible;
    }

    #title {
      width: 100%;

      margin: 10px 0 25px;

      text-align: center;

      font-family: 'Great Vibes', cursive;
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1.2;

      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message {
      width: 100%;
      max-width: 780px;

      padding: 20px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      overflow: visible;
    }

    .line {
      margin: 0 0 18px;

      color: white;

      font-family: 'Dancing Script', cursive;
      font-size: clamp(18px, 4.5vw, 27px);
      line-height: 1.55;

      text-align: center;

      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .heart {
      width: 100%;

      margin: 25px 0;

      text-align: center;

      font-family: 'Dancing Script', cursive;
      font-size: clamp(24px, 6vw, 36px);

      color: white;
    }

    .whatsapp-button {
      display: block;

      width: min(100%, 420px);

      margin: 10px auto 20px;
      padding: 15px 20px;

      border-radius: 50px;

      text-align: center;
      text-decoration: none;

      font-family: 'Roboto', sans-serif;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: bold;

      background: rgba(255, 255, 255, 0.90);
      color: #111;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);

      transition: transform 0.2s ease;
    }

    .whatsapp-button:active {
      transform: scale(0.96);
    }

    /* Mobile */
    @media (max-width: 600px) {

      body {
        background-attachment: scroll;

        background-position: center top;
        background-size: cover;
      }

      .container {
        padding: 18px 10px 35px;
      }

      #title {
        margin: 5px 0 18px;

        font-size: clamp(30px, 9vw, 44px);

        padding: 0 5px;
      }

      .message {
        width: 100%;

        padding: 16px 12px;

        border-radius: 15px;
      }

      .line {
        margin-bottom: 16px;

        font-size: clamp(18px, 5.2vw, 24px);
        line-height: 1.5;

        text-align: center;
      }

      .heart {
        margin: 20px 0;

        font-size: clamp(25px, 7vw, 32px);
      }

      .whatsapp-button {
        width: calc(100% - 10px);

        padding: 14px 12px;

        font-size: 16px;
      }
    }

    /* Very small phones */
    @media (max-width: 380px) {

      .container {
        padding-left: 7px;
        padding-right: 7px;
      }

      .message {
        padding: 14px 9px;
      }

      .line {
        font-size: 17px;
        line-height: 1.48;
      }

      #title {
        font-size: 30px;
      }
    }
  </style>

</head>

  </div>

  <script>
    const lines = document.querySelectorAll(".line");

    let lineIndex = 0;

    function typeLine() {
      if (lineIndex >= lines.length) return;

      const line = lines[lineIndex];
      const text = line.getAttribute("data-text");

      let charIndex = 0;

      function typeCharacter() {
        if (charIndex < text.length) {
          line.textContent += text.charAt(charIndex);
          charIndex++;

          setTimeout(typeCharacter, 35);
        } else {
          lineIndex++;
          setTimeout(typeLine, 400);
        }
      }

      typeCharacter();
    }

    typeLine();
  </script>
